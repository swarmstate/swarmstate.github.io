<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 716" width="1040" height="716" role="img" aria-label="Left: swarmstate sits between orchestration frameworks and four storage backends, with a Rust core across a PyO3 boundary. Right: three charts — flat read latency as a thread grows, O(1) snapshots versus O(n) deepcopy, and durable writes on par with SqliteSaver at a matched fsync policy.">
  <defs><style>
    .h    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 650; }
    .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .tb   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
    .m    { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 400; }
    .mb   { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; }
    .num  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 680; font-variant-numeric: tabular-nums; }
  </style><marker id="ar" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#58a6ff"/></marker><marker id="ar2" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#6e7b8a"/></marker></defs>
  <rect width="1040" height="716" fill="#0d1117"/>
  <rect x="0.0" y="0.0" width="386.0" height="716.0" rx="0" fill="#0f141b" stroke="none" stroke-width="1"/>
  <line x1="386.0" y1="0.0" x2="386.0" y2="716.0" stroke="#21262d" stroke-width="1"/>
  <text class="h" x="32.0" y="42.0" font-size="17" fill="#e6edf3" text-anchor="start">Where it sits</text>
  <text class="t" x="32.0" y="64.0" font-size="12" fill="#6e7b8a" text-anchor="start">underneath the framework you already run</text>
  <rect x="32.0" y="96.0" width="322.0" height="74.0" rx="10" fill="#131922" stroke="#21262d" stroke-width="1"/>
  <text class="mb" x="48.0" y="124.0" font-size="12" fill="#e6edf3" text-anchor="start">LangGraph · CrewAI · custom loop</text>
  <text class="t" x="48.0" y="144.0" font-size="11" fill="#9aa7b4" text-anchor="start">your orchestration, unchanged</text>
  <line x1="70.0" y1="174.0" x2="70.0" y2="204.0" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="m" x="84.0" y="195.0" font-size="10.5" fill="#6e7b8a" text-anchor="start">put · put_writes · get_tuple</text>
  <rect x="32.0" y="208.0" width="322.0" height="74.0" rx="10" fill="#13202e" stroke="#2b4b70" stroke-width="1"/>
  <text class="mb" x="48.0" y="236.0" font-size="12" fill="#e6edf3" text-anchor="start">SwarmStateSaver · Store · HandoffGraph</text>
  <text class="t" x="48.0" y="256.0" font-size="11" fill="#9aa7b4" text-anchor="start">Python API — thin, typed, no state held here</text>
  <line x1="70.0" y1="286.0" x2="70.0" y2="316.0" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="m" x="84.0" y="307.0" font-size="10.5" fill="#6e7b8a" text-anchor="start">msgpack bytes over PyO3</text>
  <rect x="32.0" y="320.0" width="322.0" height="74.0" rx="10" fill="#161c25" stroke="#333c48" stroke-width="1"/>
  <text class="mb" x="48.0" y="348.0" font-size="12" fill="#e6edf3" text-anchor="start">Rust core · swarmstate_core</text>
  <text class="t" x="48.0" y="368.0" font-size="11" fill="#9aa7b4" text-anchor="start">persistent map · msgpack · snapshot/diff · eval</text>
  <text class="m" x="48.0" y="384.0" font-size="10" fill="#58a6ff" text-anchor="start">GIL released</text>
  <line x1="70.0" y1="398.0" x2="70.0" y2="428.0" stroke="#6e7b8a" stroke-width="1.5" marker-end="url(#ar2)"/>
  <text class="m" x="84.0" y="419.0" font-size="10.5" fill="#6e7b8a" text-anchor="start">one Store trait</text>
  <rect x="32.0" y="432.0" width="322.0" height="74.0" rx="10" fill="#131922" stroke="#21262d" stroke-width="1"/>
  <text class="mb" x="48.0" y="460.0" font-size="12" fill="#e6edf3" text-anchor="start">memory · disk · redis · postgres</text>
  <text class="t" x="48.0" y="480.0" font-size="11" fill="#9aa7b4" text-anchor="start">one format, four backends</text>
  <text class="tb" x="32.0" y="528.0" font-size="11.5" fill="#e6edf3" text-anchor="start">The whole change to your graph</text>
  <rect x="32.0" y="540.0" width="322.0" height="82.0" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text class="m" x="46.0" y="561.0" font-size="10.5" fill="#9aa7b4" xml:space="preserve">from swarmstate.integrations \</text>
  <text class="m" x="46.0" y="578.0" font-size="10.5" fill="#9aa7b4" xml:space="preserve">    .langgraph import SwarmStateSaver</text>
  <text class="m" x="46.0" y="595.0" font-size="10.5" fill="#9aa7b4" xml:space="preserve">graph = builder.compile(</text>
  <text class="m" x="46.0" y="612.0" font-size="10.5" fill="#58a6ff" xml:space="preserve">    checkpointer=SwarmStateSaver())</text>
  <line x1="32.0" y1="646.0" x2="354.0" y2="646.0" stroke="#21262d" stroke-width="1"/>
  <text class="tb" x="32.0" y="670.0" font-size="11.5" fill="#e6edf3" text-anchor="start">One format on every backend</text>
  <text class="t" x="32.0" y="688.0" font-size="10.5" fill="#6e7b8a" text-anchor="start">msgpack — move a thread from memory to postgres,</text>
  <text class="t" x="32.0" y="702.0" font-size="10.5" fill="#6e7b8a" text-anchor="start">or read it from another language, unchanged.</text>
  <text class="h" x="434.0" y="42.0" font-size="17" fill="#e6edf3" text-anchor="start">What the Rust core buys</text>
  <text class="t" x="434.0" y="64.0" font-size="12" fill="#6e7b8a" text-anchor="start">measured, reproducible — full setup on the Benchmarks page</text>
  <text class="tb" x="434.0" y="98.0" font-size="12.5" fill="#e6edf3" text-anchor="start">Read the newest checkpoint, as the thread grows</text>
  <line x1="478.0" y1="228.0" x2="864.0" y2="228.0" stroke="#21262d" stroke-width="1"/>
  <text class="m" x="470.0" y="232.0" font-size="10" fill="#6e7b8a" text-anchor="end">0</text>
