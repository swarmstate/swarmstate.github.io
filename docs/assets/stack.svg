  <polyline points="478.0,419.3 621.0,420.0 764.0,418.9 864.0,419.7" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="864.0" cy="327.5" r="4" fill="#d95926" stroke="#0d1117" stroke-width="2"/>
