  <text class="m" x="470.0" y="183.1" font-size="10" fill="#6e7b8a" text-anchor="end">20</text>
  <line x1="478.0" y1="130.2" x2="864.0" y2="130.2" stroke="#1e242c" stroke-width="1"/>
  <text class="m" x="470.0" y="134.2" font-size="10" fill="#6e7b8a" text-anchor="end">40</text>
  <polyline points="478.0,214.6 626.3,212.9 774.7,194.0 864.0,130.2" fill="none" stroke="#d95926" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="478.0,209.9 626.3,210.1 774.7,210.2 864.0,209.6" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="864.0" cy="130.2" r="4" fill="#d95926" stroke="#0d1117" stroke-width="2"/>
  <circle cx="864.0" cy="209.6" r="4" fill="#3987e5" stroke="#0d1117" stroke-width="2"/>
  <text class="m" x="478.0" y="243.0" font-size="10" fill="#6e7b8a" text-anchor="middle">5</text>
  <text class="m" x="626.3" y="243.0" font-size="10" fill="#6e7b8a" text-anchor="middle">50</text>
  <text class="m" x="774.7" y="243.0" font-size="10" fill="#6e7b8a" text-anchor="middle">500</text>
  <text class="m" x="864.0" y="243.0" font-size="10" fill="#6e7b8a" text-anchor="middle">2,000</text>
  <text class="t" x="671.0" y="258.0" font-size="10" fill="#6e7b8a" text-anchor="middle">checkpoints in thread · µs</text>
  <circle cx="880.0" cy="130.2" r="4.5" fill="#d95926"/><text class="tb" x="892.0" y="134.2" font-size="11.5" fill="#e6edf3" text-anchor="start">InMemorySaver</text><text class="m" x="892.0" y="151.2" font-size="10.5" fill="#9aa7b4" text-anchor="start">5.5 → 40.0 µs</text>
  <circle cx="880.0" cy="209.6" r="4.5" fill="#3987e5"/><text class="tb" x="892.0" y="213.6" font-size="11.5" fill="#e6edf3" text-anchor="start">swarmstate</text><text class="m" x="892.0" y="230.6" font-size="10.5" fill="#9aa7b4" text-anchor="start">7.4 → 7.5 µs — flat</text>
  <text class="tb" x="434.0" y="302.0" font-size="12.5" fill="#e6edf3" text-anchor="start">Snapshot the whole store, as state grows</text>
  <line x1="478.0" y1="432.0" x2="864.0" y2="432.0" stroke="#1e242c" stroke-width="1"/>
  <text class="m" x="470.0" y="436.0" font-size="10" fill="#6e7b8a" text-anchor="end">0.0001</text>
  <line x1="478.0" y1="395.3" x2="864.0" y2="395.3" stroke="#1e242c" stroke-width="1"/>
  <text class="m" x="470.0" y="399.3" font-size="10" fill="#6e7b8a" text-anchor="end">0.01</text>
