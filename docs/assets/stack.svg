  <text class="m" x="764.0" y="447.0" font-size="10" fill="#6e7b8a" text-anchor="middle">10,000</text>
  <text class="m" x="864.0" y="447.0" font-size="10" fill="#6e7b8a" text-anchor="middle">50,000</text>
  <text class="t" x="671.0" y="462.0" font-size="10" fill="#6e7b8a" text-anchor="middle">entries in store · ms, log scale</text>
  <circle cx="880.0" cy="327.5" r="4.5" fill="#d95926"/><text class="tb" x="892.0" y="331.5" font-size="11.5" fill="#e6edf3" text-anchor="start">dict deepcopy</text><text class="m" x="892.0" y="348.5" font-size="10.5" fill="#9aa7b4" text-anchor="start">50.2 ms — O(n)</text>
  <circle cx="880.0" cy="419.7" r="4.5" fill="#3987e5"/><text class="tb" x="892.0" y="423.7" font-size="11.5" fill="#e6edf3" text-anchor="start">Store.snapshot()</text><text class="m" x="892.0" y="440.7" font-size="10.5" fill="#9aa7b4" text-anchor="start">0.0005 ms — O(1)</text>
  <text class="tb" x="434.0" y="506.0" font-size="12.5" fill="#e6edf3" text-anchor="start">Durable checkpoint write · put p50</text>
  <text class="t" x="434.0" y="524.0" font-size="10.5" fill="#6e7b8a" text-anchor="start">both are SQLite files in WAL mode</text>
