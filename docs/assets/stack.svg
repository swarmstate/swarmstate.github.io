  <text class="tb" x="434.0" y="559.0" font-size="11.5" fill="#e6edf3" text-anchor="start">swarmstate + DiskStore</text>
  <path d="M610.0,544.0 h117.8 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-117.8 z" fill="#3987e5"/>
  <text class="m" x="741.8" y="559.0" font-size="10.5" fill="#9aa7b4" text-anchor="start">34.1 µs · NORMAL</text>
  <path d="M610.0,582.0 h119.9 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-119.9 z" fill="#d95926"/>
  <text class="m" x="743.9" y="597.0" font-size="10.5" fill="#9aa7b4" text-anchor="start">34.7 µs · same NORMAL</text>
  <text class="tb" x="434.0" y="609.0" font-size="11.5" fill="#e6edf3" text-anchor="start">SqliteSaver</text>
  <path d="M610.0,606.0 h224.2 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-224.2 z" fill="#d95926"/>
  <text class="m" x="848.2" y="621.0" font-size="10.5" fill="#9aa7b4" text-anchor="start">63.9 µs · shipped FULL</text>
  <text class="t" x="434.0" y="652.0" font-size="11" fill="#6e7b8a" text-anchor="start">On par at a matched fsync policy (1.02×), and 1.9× faster than SqliteSaver’s</text>
  <text class="t" x="434.0" y="668.0" font-size="11" fill="#6e7b8a" text-anchor="start">shipped default — which buys stronger durability, not nothing.</text>
</svg>
